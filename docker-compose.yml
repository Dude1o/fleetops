services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - '3000:3000'

    env_file:
      - .env

    environment:
      DATABASE_URL: postgres://fleetops:[REDACTED]@postgres:5432/fleetops

    depends_on:
      - postgres

  postgres:
    image: postgres:17

    environment:
      POSTGRES_USER: fleetops
      POSTGRES_PASSWORD: fleetops
      POSTGRES_DB: fleetops

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
