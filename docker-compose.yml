services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - '3000:3000'

    env_file:
      - .env

    environment:
      DATABASE_URL: postgres://fleetops:[REDACTED]@postgres:5432/fleetops
      REDIS_URL: redis://redis:6379

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgis/postgis:17-3.5

    environment:
      POSTGRES_USER: fleetops
      POSTGRES_PASSWORD: fleetops
      POSTGRES_DB: fleetops

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fleetops -d fleetops']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: fleetops-redis
    restart: unless-stopped

    ports:
      - '6379:6379'

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
